name: release

# Publish the per-OS compositor tarballs and renderer-xr AAR for a tag.
#
# This is the release train the split exists to create. In compose-ai-tools the compositor was
# rebuilt and republished on EVERY release — 226 of them, 1.23 GB, for 13 changes to the C++ —
# because both consumers addressed the binary by their own version. compose-ai-tools#4773 broke
# that by giving it a version pin; this repository is where that pin's releases now come from.
#
# Cutting one:
#   1. merge the "chore(main): release X.Y.Z" pull request release-please keeps open. That creates
#      the tag and the Release and, in the same run, calls this workflow to build all three
#      platforms and attach the tarballs;
#   2. point the `xr-composite` pin in compose-ai-tools' gradle/libs.versions.toml at X.Y.Z.
#
# The tag-push and dispatch triggers below are for a hand-cut tag and for re-running the asset
# upload onto an existing Release; neither is the normal path.
#
# Until compose-ai-tools' `XrCompositeProvision.assetUrl` is switched to this repository, its CLI
# still fetches assets from the compose-ai-tools release namespace. Releases cut here before that
# switch are published but not yet consumed — deliberately, so the cutover never leaves the
# provisioner resolving a tag that does not exist. See compose-ai-tools#4774 item 4.

on:
  # Primary path: release-please calls this after it creates the tag and Release. A tag created
  # with GITHUB_TOKEN does NOT trigger `on: push: tags`, so chaining is the only thing that works.
  workflow_call:
    inputs:
      tag:
        description: 'Tag whose Release the assets attach to, e.g. v1.2.3.'
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME: {required: true}
      MAVEN_CENTRAL_PASSWORD: {required: true}
      SIGNING_KEY: {required: true}
      SIGNING_KEY_ID: {required: true}
      SIGNING_KEY_PASSWORD: {required: true}
  # For a tag a human pushes by hand, which does trigger workflows.
  push:
    tags: ['v*']
  # For re-running assets onto an existing Release after a partial upload.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag whose Release the assets attach to, e.g. v1.2.3.'
        required: true

permissions:
  contents: read

concurrency:
  # Key on the tag being released. Under workflow_call `github.ref_name` is the caller's branch
  # (main), so keying on it would put every release in one slot alongside ordinary main pushes.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: linux-x86_64
          - os: macos-14
            platform: mac
            asset: macos-arm64
          - os: windows-2022
            platform: windows
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Build the released commit. Under workflow_call the ref is the caller's (main), which
          # can already have moved past the release PR's merge.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Derive the version
        shell: bash
        env:
          # `inputs.tag` covers workflow_call and workflow_dispatch; `github.ref_name` covers a
          # hand-pushed tag. Read from env rather than templated into the script so a crafted ref
          # cannot break out of the quoting.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v?*) version="${tag#v}" ;;
            *)
              echo "::error::expected a tag like v1.2.3, got '$tag'."
              exit 1
              ;;
          esac
          echo "XR_VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-xr-composite
        with:
          platform: ${{ matrix.platform }}
      - name: Package the versioned tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged-artifacts
          tar -C dist -czf \
            "staged-artifacts/xr-composite-${{ matrix.asset }}-${XR_VERSION}.tar.gz" .
          ls -l staged-artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: xr-composite-${{ matrix.asset }}
          path: staged-artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish-renderer:
    needs: build
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Derive the version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v?*) echo "XR_VERSION=${tag#v}" >> "$GITHUB_ENV" ;;
            *) echo "::error::expected a tag like v1.2.3, got '$tag'."; exit 1 ;;
          esac
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5.0.0
      - name: Publish renderer-xr to Maven Central
        run: ./gradlew --no-daemon :renderer-xr:publishAndReleaseToMavenCentral --stacktrace

  publish:
    needs: [build, publish-renderer]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release and upload assets
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the Release
        # `--clobber` so a re-run after a partial upload converges instead of erroring. The tag
        # name is read from env, never templated into the script, so a crafted ref cannot break
        # out of the quoting.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l artifacts
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --clobber artifacts/xr-composite-*.tar.gz
          else
            gh release create "$TAG_NAME" \
              --title "xr-composite ${TAG_NAME#v}" \
              --generate-notes \
              artifacts/xr-composite-*.tar.gz
          fi
          echo "published xr-composite assets onto $TAG_NAME"
