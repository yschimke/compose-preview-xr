name: release-please

# Keeps a "chore(main): release X.Y.Z" pull request up to date from conventional-commit history.
# Merging it creates the tag and the GitHub Release, and then — in this same run — builds the three
# platform tarballs and attaches them.
#
# Chaining `release.yml` here rather than letting it trigger on the tag push is not a style choice:
# a tag created with GITHUB_TOKEN does not trigger `on: push: tags`, so a tag-triggered build would
# simply never run. `release.yml` keeps its tag trigger anyway, for a tag a human pushes by hand.
#
# Deliberately much simpler than upstream's release-please, which juggles draft releases, a
# finalize pass and a split PR pass because it publishes to Maven Central, npm and the Plugin
# Portal — irreversible registries where a half-published release is unrecoverable. Here the only
# artifacts are three tarballs on a GitHub Release, and `gh release upload --clobber` makes a
# re-run converge, so none of that machinery earns its keep.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the tag and the GitHub Release
      pull-requests: write   # open and update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and attach the per-OS tarballs onto the Release release-please just created. Runs only on
  # the push that merged a release PR; every other push to main stops at the job above.
  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # A Release with no assets is worse than no Release: the consumer's provisioner treats a missing
  # tarball as a graceful skip, so it degrades into "no composite" with nothing in any log. Fail
  # loudly instead, naming what is missing.
  verify:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every platform tarball is on the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          assets="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          echo "$assets"
          status=0
          for platform in linux-x86_64 macos-arm64 windows-x86_64; do
            want="xr-composite-${platform}-${version}.tar.gz"
            if ! grep -qxF "$want" <<<"$assets"; then
              echo "::error::$TAG_NAME is missing $want"
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "ok: all three platform tarballs are attached to $TAG_NAME"
          exit $status
