[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ktfmt = "0.27.0"
maven-publish = "0.37.0"
compose-preview = "2.34.0"
# The library coordinates (preview-data-api, preview-annotations, the layout-inspector connector,
# renderer-android) are published by yschimke/compose-preview-daemon on its own 3.x line, not at the
# plugin's version. Keep this at the daemon line the `compose-preview` plugin above was released
# against (compose-ai-tools' `composeai-preview-daemon` pin at that tag).
composeai-preview-daemon = "3.12.0"
composeai-contracts = "2.20.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
xr-compose = "1.0.0-beta01"
# Held at beta02: the 1.0.0-rc01 runtime set ("improved internal lifecycle events handling") defers
# Session resume/pause through a configuration mutex, and under Robolectric the fake runtimes are then
# never laid out (panel sizes read 0) and are destroyed while still RESUMED. Moving to rc01 needs the
# offline session wiring ported; the three move together because Gradle resolves them as one set.
xr-runtime-testing = "1.0.0-beta02"
xr-scenecore-testing = "1.0.0-beta02"
xr-arcore-testing = "1.0.0-beta02"
robolectric = "4.17"
roborazzi = "1.75.0"
junit = "4.13.2"
truth = "1.4.5"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
xr-compose = { module = "androidx.xr.compose:compose", version.ref = "xr-compose" }
xr-compose-testing = { module = "androidx.xr.compose:compose-testing", version.ref = "xr-compose" }
xr-runtime-testing = { module = "androidx.xr.runtime:runtime-testing", version.ref = "xr-runtime-testing" }
xr-scenecore-testing = { module = "androidx.xr.scenecore:scenecore-testing", version.ref = "xr-scenecore-testing" }
xr-arcore-testing = { module = "androidx.xr.arcore:arcore-testing", version.ref = "xr-arcore-testing" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
preview-data-api = { module = "ee.schimke.composeai:preview-data-api", version.ref = "composeai-preview-daemon" }
preview-annotations = { module = "ee.schimke.composeai:preview-annotations", version.ref = "composeai-preview-daemon" }
data-layoutinspector-connector = { module = "ee.schimke.composeai:data-layoutinspector-connector", version.ref = "composeai-preview-daemon" }
data-render-core = { module = "ee.schimke.composeai:data-render-core", version.ref = "composeai-contracts" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
compose-preview = { id = "ee.schimke.composeai.preview", version.ref = "compose-preview" }
